name: iris-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy==1.26.3
  - scikit-learn==1.3.2
  - pip:
    - joblib==1.3.2
    - mlflow==2.9.1
    - pandas==2.1.3
    - pyyaml==6.0.1
    - setuptools<81
    # Requis par Azure ML Managed Online Endpoint pour exécuter le serveur
    # HTTP interne qui appelle init()/run() de score.py. Sans ce paquet le
    # conteneur crashe au démarrage (BadArgument: User container has
    # crashed or terminated). Non épinglé: pas d'accès réseau ici pour
    # vérifier une version exacte compatible avec cette image de base.
    - azureml-inference-server-http
